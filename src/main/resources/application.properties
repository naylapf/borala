spring.application.name=borala

# Banco de dados (PostgreSQL). Crie o banco "borala" antes de rodar.
# Cada pessoa do grupo pode sobrescrever usuário e senha com as variáveis de ambiente DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/borala}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Poucas conexões simultâneas: planos gratuitos de banco na nuvem (ex.: Supabase) limitam isso.
spring.datasource.hikari.maximum-pool-size=5

# Cria/atualiza as tabelas a partir das entidades. Use apenas em desenvolvimento.
spring.jpa.hibernate.ddl-auto=update

# Mantém a sessão do JPA aberta até renderizar a página, para o Thymeleaf acessar relacionamentos.
spring.jpa.open-in-view=true

# Upload de imagens (pratos e mídias). Ficam na tabela "imagem" do banco e são servidas em /fotos/{id}.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Dados de demonstração (restaurantes com fotos e avaliações fictícios). Ative com DADOS_DEMO=true.
borala.dados-demo=${DADOS_DEMO:false}

# Administrador inicial do sistema (grupo do projeto). Criado na primeira execução se ainda não existir nenhum ADMIN.
# Troque a senha depois do primeiro login ou defina ADMIN_EMAIL e ADMIN_SENHA como variáveis de ambiente.
borala.admin.email=${ADMIN_EMAIL:admin@borala.com}
borala.admin.senha=${ADMIN_SENHA:admin12345}
