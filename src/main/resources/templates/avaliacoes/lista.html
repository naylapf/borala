<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecalho('Avaliações')}"></head>
<body>
<nav th:replace="~{fragments/base :: menu}"></nav>
<main id="conteudo">
    <h1 th:text="'Avaliações - ' + ${usuario.nome}">Avaliações</h1>
    <p><a th:href="@{/usuarios}">&larr; Voltar aos usuários</a></p>

    <p class="mensagem" th:if="${mensagem}" th:text="${mensagem}">Mensagem</p>
    <p class="erro" th:if="${erro}" th:text="${erro}">Erro</p>

    <p><a class="botao" th:href="@{/usuarios/{id}/avaliacoes/novo(id=${usuario.id})}">Nova avaliação</a></p>

    <table>
        <thead>
            <tr><th scope="col">Restaurante</th><th scope="col">Nota</th><th scope="col">Comentário</th><th scope="col">Data</th><th scope="col">Ações</th></tr>
        </thead>
        <tbody>
            <tr th:each="avaliacao : ${avaliacoes}">
                <td th:text="${avaliacao.restaurante.nome}">Restaurante</td>
                <td th:text="${avaliacao.nota + '/5'}">5/5</td>
                <td th:text="${avaliacao.comentario}">Comentário</td>
                <td th:text="${avaliacao.data}">2026-10-31</td>
                <td class="acoes">
                    <a th:href="@{/usuarios/{uid}/avaliacoes/{id}/editar(uid=${usuario.id}, id=${avaliacao.id})}">Editar</a>
                    <form th:action="@{/usuarios/{uid}/avaliacoes/{id}/excluir(uid=${usuario.id}, id=${avaliacao.id})}" method="post"
                          onsubmit="return confirm('Excluir esta avaliação?')">
                        <button type="submit" class="perigo">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(avaliacoes)}">
                <td colspan="5">Nenhuma avaliação.</td>
            </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments/base :: rodape}"></footer>
</body>
</html>
