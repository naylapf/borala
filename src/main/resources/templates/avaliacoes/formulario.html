<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecalho('Avaliação')}"></head>
<body>
<nav th:replace="~{fragments/base :: menu}"></nav>
<main id="conteudo">
    <h1 th:text="(${form.id == null} ? 'Nova avaliação' : 'Editar avaliação') + ' - ' + ${usuario.nome}">Avaliação</h1>
    <p><a th:href="@{/usuarios/{id}/avaliacoes(id=${usuario.id})}">&larr; Voltar às avaliações</a></p>

    <form th:action="@{/usuarios/{id}/avaliacoes(id=${usuario.id})}" th:object="${form}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="campo">
            <label for="restauranteId">Restaurante</label>
            <select th:field="*{restauranteId}" th:errorclass="invalido">
                <option value="">Selecione</option>
                <option th:each="restaurante : ${restaurantes}" th:value="${restaurante.id}"
                        th:text="${restaurante.nome + ' - ' + restaurante.endereco.cidade}">Restaurante</option>
            </select>
            <small th:if="${#fields.hasErrors('restauranteId')}" th:errors="*{restauranteId}">Erro</small>
        </div>

        <div th:replace="~{fragments/base :: campo('Nota (1 a 5)', 'nota', 'number')}"></div>

        <div class="campo">
            <label for="comentario">Comentário (opcional)</label>
            <textarea th:field="*{comentario}" th:errorclass="invalido"></textarea>
            <small th:if="${#fields.hasErrors('comentario')}" th:errors="*{comentario}">Erro</small>
        </div>

        <button type="submit">Salvar</button>
        <a th:href="@{/usuarios/{id}/avaliacoes(id=${usuario.id})}">Cancelar</a>
    </form>
</main>
<footer th:replace="~{fragments/base :: rodape}"></footer>
</body>
</html>
