<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecalho('Erro')}"></head>
<body>
<nav th:replace="~{fragments/base :: menu}"></nav>
<main id="conteudo">
    <h1 th:text="${status == 404} ? 'Página não encontrada' : 'Algo deu errado'">Algo deu errado</h1>
    <p th:if="${status == 404}">O endereço ou o registro que você procura não existe.</p>
    <p th:unless="${status == 404}">Não foi possível concluir a operação. Tente novamente.</p>
    <p><a th:href="@{/}">Voltar para o início</a></p>
</main>
<footer th:replace="~{fragments/base :: rodape}"></footer>
</body>
</html>
