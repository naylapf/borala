<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecalho('Mídia')}"></head>
<body>
<nav th:replace="~{fragments/base :: menu}"></nav>
<main id="conteudo">
    <h1 th:text="(${form.id == null} ? 'Nova mídia' : 'Editar mídia') + ' - ' + ${restaurante.nome}">Mídia</h1>
    <p><a th:href="@{/restaurantes/{id}/midias(id=${restaurante.id})}">&larr; Voltar às mídias</a></p>

    <p class="erro" th:if="${erro}" th:text="${erro}">Erro</p>

    <form th:action="@{/restaurantes/{id}/midias(id=${restaurante.id})}" th:object="${form}" method="post"
          enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}">

        <div class="campo">
            <label for="tipo">Tipo</label>
            <select th:field="*{tipo}" th:errorclass="invalido">
                <option value="">Selecione</option>
                <option th:each="opcao : ${tipos}" th:value="${opcao}" th:text="${opcao.rotulo}">Foto</option>
            </select>
            <small th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}">Erro</small>
        </div>

        <div class="campo" id="blocoFoto">
            <label for="arquivo">Foto (JPG, PNG ou WEBP, até 5 MB)</label>
            <img id="previaFoto" class="previa" th:if="${form.fotoAtual != null}" th:src="@{${form.fotoAtual}}" alt="Foto atual">
            <img id="previaNova" class="previa" alt="Nova foto" hidden>
            <input type="file" id="arquivo" name="arquivo" accept="image/jpeg,image/png,image/webp"
                   th:classappend="${#fields.hasErrors('arquivo')} ? 'invalido'">
            <small th:if="${#fields.hasErrors('arquivo')}" th:errors="*{arquivo}">Erro</small>
            <small th:if="${form.fotoAtual != null}">Deixe em branco para manter a foto atual.</small>
        </div>

        <div class="campo" id="blocoVideo">
            <label for="url">Link do vídeo</label>
            <input type="text" th:field="*{url}" th:errorclass="invalido" placeholder="https://...">
            <small th:if="${#fields.hasErrors('url')}" th:errors="*{url}">Erro</small>
        </div>

        <button type="submit">Salvar</button>
        <a th:href="@{/restaurantes/{id}/midias(id=${restaurante.id})}">Cancelar</a>
    </form>
</main>
<script th:replace="~{fragments/base :: previaImagem('arquivo', 'previaNova')}"></script>
<script>
    // mostra só o campo que combina com o tipo escolhido: foto = arquivo, vídeo = link
    (function () {
        var tipo = document.getElementById('tipo');
        function alternar() {
            document.getElementById('blocoFoto').hidden = tipo.value !== 'FOTO';
            document.getElementById('blocoVideo').hidden = tipo.value !== 'VIDEO';
        }
        tipo.addEventListener('change', alternar);
        alternar();
    })();
</script>
<footer th:replace="~{fragments/base :: rodape}"></footer>
</body>
</html>
