<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecalho('Usuário')}"></head>
<body>
<nav th:replace="~{fragments/base :: menu}"></nav>
<main id="conteudo">
    <h1 th:text="${form.id == null} ? 'Novo usuário' : 'Editar usuário'">Usuário</h1>

    <form th:action="@{/usuarios}" th:object="${form}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" th:field="*{nome}" th:errorclass="invalido">
            <small th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</small>
        </div>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" th:field="*{email}" th:errorclass="invalido">
            <small th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Erro</small>
        </div>

        <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="text" th:field="*{telefone}" placeholder="(67) 99999-9999" th:errorclass="invalido">
            <small th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}">Erro</small>
        </div>

        <div class="campo">
            <label for="papel">Papel</label>
            <select th:field="*{papel}" th:errorclass="invalido">
                <option value="">Selecione</option>
                <option th:each="opcao : ${papeis}" th:value="${opcao}" th:text="${opcao}">CLIENTE</option>
            </select>
            <small th:if="${#fields.hasErrors('papel')}" th:errors="*{papel}">Erro</small>
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" th:field="*{senha}" th:errorclass="invalido"
                   th:placeholder="${form.id == null} ? 'Mínimo de 8 caracteres' : 'Deixe em branco para manter a atual'">
            <small th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}">Erro</small>
        </div>

        <div class="campo">
            <label for="confirmarSenha">Confirmar senha</label>
            <input type="password" th:field="*{confirmarSenha}" th:errorclass="invalido"
                   th:placeholder="${form.id == null} ? 'Repita a senha' : 'Repita a nova senha, se for trocar'">
            <small th:if="${#fields.hasErrors('confirmarSenha')}" th:errors="*{confirmarSenha}">Erro</small>
        </div>

        <button type="submit">Salvar</button>
        <a th:href="@{/usuarios}">Cancelar</a>
    </form>
</main>
<footer th:replace="~{fragments/base :: rodape}"></footer>
</body>
</html>
