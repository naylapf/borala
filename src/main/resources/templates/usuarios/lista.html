<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecalho('Usuários')}"></head>
<body>
<nav th:replace="~{fragments/base :: menu}"></nav>
<main id="conteudo">
    <h1>Usuários</h1>

    <p class="mensagem" th:if="${mensagem}" th:text="${mensagem}">Mensagem</p>
    <p class="erro" th:if="${erro}" th:text="${erro}">Erro</p>

    <p><a class="botao" th:href="@{/usuarios/novo}">Novo usuário</a></p>

    <table>
        <thead>
            <tr><th scope="col">Nome</th><th scope="col">E-mail</th><th scope="col">Telefone</th><th scope="col">Papel</th><th scope="col">Ações</th></tr>
        </thead>
        <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.nome}">Nome</td>
                <td th:text="${usuario.email}">email@exemplo.com</td>
                <td th:text="${usuario.telefone}">67999999999</td>
                <td th:text="${usuario.papel}">CLIENTE</td>
                <td class="acoes">
                    <a th:href="@{/usuarios/{id}/editar(id=${usuario.id})}">Editar</a>
                    <a th:href="@{/usuarios/{id}/favoritas(id=${usuario.id})}">Favoritos</a>
                    <a th:href="@{/usuarios/{id}/avaliacoes(id=${usuario.id})}">Avaliações</a>
                    <a th:href="@{/usuarios/{id}/buscas(id=${usuario.id})}">Buscas</a>
                    <form th:action="@{/usuarios/{id}/excluir(id=${usuario.id})}" method="post"
                          onsubmit="return confirm('Excluir este usuário?')">
                        <button type="submit" class="perigo">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="5">Nenhum usuário cadastrado.</td>
            </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments/base :: rodape}"></footer>
</body>
</html>
