<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecalho('Buscas')}"></head>
<body>
<nav th:replace="~{fragments/base :: menu}"></nav>
<main id="conteudo">
    <h1 th:text="'Histórico de buscas - ' + ${usuario.nome}">Buscas</h1>
    <p><a th:href="@{/usuarios}">&larr; Voltar aos usuários</a></p>

    <p class="mensagem" th:if="${mensagem}" th:text="${mensagem}">Mensagem</p>
    <p class="erro" th:if="${erro}" th:text="${erro}">Erro</p>

    <form th:action="@{/usuarios/{id}/buscas(id=${usuario.id})}" th:object="${form}" method="post">
        <div th:replace="~{fragments/base :: campo('Palavra-chave', 'palavraChave', 'text')}"></div>
        <div th:replace="~{fragments/base :: campo('Filtros (ex.: cidade=Campo Grande; bairro=Centro)', 'filtros', 'text')}"></div>
        <button type="submit">Registrar busca</button>
    </form>

    <table>
        <thead>
            <tr><th scope="col">Data e hora</th><th scope="col">Palavra-chave</th><th scope="col">Filtros</th><th scope="col">Ações</th></tr>
        </thead>
        <tbody>
            <tr th:each="busca : ${buscas}">
                <td th:text="${#strings.replace(#strings.substring(busca.dataHora.toString(), 0, 16), 'T', ' ')}">2026-10-31 12:00</td>
                <td th:text="${busca.palavraChave}">pizza</td>
                <td th:text="${busca.filtros}">cidade=Campo Grande</td>
                <td class="acoes">
                    <form th:action="@{/usuarios/{uid}/buscas/{id}/excluir(uid=${usuario.id}, id=${busca.id})}" method="post"
                          onsubmit="return confirm('Apagar esta busca?')">
                        <button type="submit" class="perigo">Apagar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(buscas)}">
                <td colspan="4">Nenhuma busca registrada.</td>
            </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments/base :: rodape}"></footer>
</body>
</html>
