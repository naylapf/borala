<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecalho('Cadastro de cliente')}"></head>
<body>
<div class="divisao">
    <aside th:replace="~{fragments/base :: painelAzul}"></aside>

    <main id="conteudo" class="painel-form">
        <h2>Cadastro de cliente</h2>

        <form class="caixa-form" th:action="@{/cadastro/cliente}" th:object="${form}" method="post">
            <div th:replace="~{fragments/base :: campo('Nome', 'nome', 'text')}"></div>
            <div th:replace="~{fragments/base :: campo('E-mail', 'email', 'email')}"></div>
            <div th:replace="~{fragments/base :: campo('Telefone', 'telefone', 'text')}"></div>
            <div th:replace="~{fragments/base :: campo('Senha (mínimo de 8 caracteres)', 'senha', 'password')}"></div>
            <div th:replace="~{fragments/base :: campo('Confirmar senha', 'confirmarSenha', 'password')}"></div>

            <button class="botao-principal" type="submit">Cadastrar</button>
        </form>

        <p class="links"><a th:href="@{/cadastro}">Voltar</a> · Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </main>
</div>
<footer th:replace="~{fragments/base :: rodape}"></footer>
</body>
</html>
