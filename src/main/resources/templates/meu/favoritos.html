<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecalho('Favoritos')}"></head>
<body>
<nav th:replace="~{fragments/base :: menu}"></nav>
<main id="conteudo">
    <h1>Meus favoritos</h1>

    <p class="mensagem" th:if="${mensagem}" th:text="${mensagem}">Mensagem</p>

    <div class="cartoes">
        <div class="com-acao" th:each="restaurante : ${restaurantes}">
            <article th:replace="~{fragments/base :: cartaoRestaurante(${restaurante})}"></article>
            <form th:action="@{/meu/favoritos/{id}/alternar(id=${restaurante.id}, voltar='favoritos')}" method="post">
                <button type="submit" class="perigo">Remover dos favoritos</button>
            </form>
        </div>
    </div>
    <p th:if="${#lists.isEmpty(restaurantes)}">
        Você ainda não favoritou nenhum restaurante. <a th:href="@{/}">Procure um restaurante</a> e toque em "Favoritar".
    </p>
</main>
<footer th:replace="~{fragments/base :: rodape}"></footer>
</body>
</html>
