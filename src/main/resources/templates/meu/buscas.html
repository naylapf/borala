<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecalho('Histórico de buscas')}"></head>
<body>
<nav th:replace="~{fragments/base :: menu}"></nav>
<main id="conteudo">
    <h1>Histórico de buscas</h1>
    <p class="detalhe">As buscas que você faz na página inicial ficam aqui e ajudam a sugerir restaurantes para você.</p>

    <p class="mensagem" th:if="${mensagem}" th:text="${mensagem}">Mensagem</p>

    <form th:if="${!#lists.isEmpty(buscas)}" th:action="@{/meu/buscas/limpar}" method="post"
          onsubmit="return confirm('Apagar todo o histórico de buscas?')">
        <button type="submit" class="perigo">Apagar todo o histórico</button>
    </form>

    <table>
        <thead>
            <tr><th scope="col">Quando</th><th scope="col">Palavra-chave</th><th scope="col">Filtros</th><th scope="col">Ações</th></tr>
        </thead>
        <tbody>
            <tr th:each="busca : ${buscas}">
                <td th:text="${#temporals.format(busca.dataHora, 'dd/MM/yyyy HH:mm')}">01/01/2026 12:00</td>
                <td>
                    <a th:if="${busca.palavraChave != null}" th:href="@{/(nome=${busca.palavraChave})}" th:text="${busca.palavraChave}">pizza</a>
                </td>
                <td th:text="${busca.filtros}">cidade=Campo Grande</td>
                <td class="acoes">
                    <form th:action="@{/meu/buscas/{id}/excluir(id=${busca.id})}" method="post">
                        <button type="submit" class="perigo">Remover</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(buscas)}">
                <td colspan="4">Nenhuma busca registrada ainda. <a th:href="@{/}">Faça uma busca</a>.</td>
            </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments/base :: rodape}"></footer>
</body>
</html>
