<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecalho(${titulo})}"></head>
<body>
<nav th:replace="~{fragments/base :: menu}"></nav>
<main id="conteudo">
    <h1 th:text="${titulo}">Título</h1>
    <p th:if="${voltarUrl}"><a th:href="@{${voltarUrl}}">&larr; Voltar</a></p>

    <p class="mensagem" th:if="${mensagem}" th:text="${mensagem}">Mensagem</p>
    <p class="erro" th:if="${erro}" th:text="${erro}">Erro</p>

    <p><a class="botao" th:href="@{${urlBase + '/novo'}}">Novo</a></p>

    <table>
        <thead>
            <tr><th scope="col">Nome</th><th scope="col">Ações</th></tr>
        </thead>
        <tbody>
            <tr th:each="item : ${itens}">
                <td th:text="${item.nome}">Nome</td>
                <td class="acoes">
                    <a th:href="@{${urlBase + '/' + item.id + '/editar'}}">Editar</a>
                    <form th:action="@{${urlBase + '/' + item.id + '/excluir'}}" method="post"
                          onsubmit="return confirm('Excluir este item?')">
                        <button type="submit" class="perigo">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(itens)}">
                <td colspan="2">Nenhum item cadastrado.</td>
            </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments/base :: rodape}"></footer>
</body>
</html>
